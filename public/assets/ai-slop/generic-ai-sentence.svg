<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a generic AI-written sentence</title>
  <desc id="desc">A polished sentence full of vague AI writing patterns is annotated with counts for abstract nouns, vague verbs, examples, and named people or products. A clearer rewrite appears below.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity=".28"/>
    </filter>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0f172a"/>
  <circle cx="1420" cy="80" r="260" fill="#7c3aed" opacity=".16"/>
  <circle cx="1500" cy="820" r="300" fill="#22d3ee" opacity=".10"/>

  <text x="84" y="92" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">THE AI COPY FINGERPRINT</text>
  <text x="84" y="162" fill="#f8fafc" font-family="Arial, sans-serif" font-size="52" font-weight="800">The sentence arrived before the idea.</text>
  <text x="84" y="207" fill="#aebbd1" font-family="Arial, sans-serif" font-size="24">Grammatically smooth. Strategically empty. Familiar enough to escape review.</text>

  <rect x="84" y="268" width="1012" height="360" rx="28" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="308" width="210" height="38" rx="19" fill="#312e81"/>
  <text x="225" y="334" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">ORIGINAL COPY</text>

  <text x="120" y="420" fill="#f8fafc" font-family="Arial, sans-serif" font-size="37" font-weight="700">
    <tspan x="120" dy="0" fill="#f59e0b">In today's rapidly evolving landscape,</tspan>
    <tspan x="120" dy="62">organizations must </tspan>
    <tspan fill="#c084fc">leverage innovative solutions</tspan>
    <tspan x="120" dy="62">to </tspan>
    <tspan fill="#38bdf8">unlock efficiency, drive growth,</tspan>
    <tspan x="120" dy="62">and </tspan>
    <tspan fill="#fb7185">stay ahead of the curve.</tspan>
  </text>

  <g font-family="Arial, sans-serif">
    <rect x="1148" y="268" width="368" height="360" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
    <text x="1190" y="322" fill="#0f172a" font-size="23" font-weight="800">What did it actually say?</text>

    <text x="1190" y="397" fill="#7c3aed" font-size="46" font-weight="800">5</text>
    <text x="1252" y="397" fill="#334155" font-size="22" font-weight="700">abstract nouns</text>
    <line x1="1190" y1="420" x2="1474" y2="420" stroke="#e2e8f0" stroke-width="2"/>

    <text x="1190" y="474" fill="#0284c7" font-size="46" font-weight="800">3</text>
    <text x="1252" y="474" fill="#334155" font-size="22" font-weight="700">vague verbs</text>
    <line x1="1190" y1="497" x2="1474" y2="497" stroke="#e2e8f0" stroke-width="2"/>

    <text x="1190" y="551" fill="#ef4444" font-size="46" font-weight="800">0</text>
    <text x="1252" y="551" fill="#334155" font-size="22" font-weight="700">examples or proof</text>
    <line x1="1190" y1="574" x2="1474" y2="574" stroke="#e2e8f0" stroke-width="2"/>

    <text x="1332" y="611" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="700" letter-spacing=".8">NO PERSON. NO PRODUCT. NO STAKES.</text>
  </g>

  <rect x="84" y="682" width="1432" height="142" rx="26" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <rect x="116" y="714" width="182" height="36" rx="18" fill="#0891b2"/>
  <text x="207" y="739" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">CLEAR VERSION</text>
  <text x="116" y="790" fill="#164e63" font-family="Arial, sans-serif" font-size="29" font-weight="700">
    Our support team spends six hours a week copying account notes. This workflow cuts that to one.
  </text>
</svg>
